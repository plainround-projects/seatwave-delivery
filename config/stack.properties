# The lab database of compose.yaml, for the stack tests and the two measuring programs.
# Every key is required; StackSettings reports every missing or out-of-range key at once.
db.url=jdbc:postgresql://127.0.0.1:23500/seatwave
db.ownerUser=seatwave_owner
db.ownerPasswordFile=.secrets/owner.password
db.appUser=seatwave_app
db.appPasswordFile=.secrets/app.password
# 300 requests a second at a few milliseconds each need about 2 connections; 32 leave room for a
# brief lock wait without every request queuing for a connection.
db.poolSize=32
db.connectTimeoutMillis=5000
# Lab 3's load: Module 33's 3 pods replaced one at a time in 77 s, 300 requests a second that touch
# bookings.price (10 percent of Module 33's 3,000), 60 quiet seconds after each rollout.
load.requestsPerSecond=300
load.pods=3
load.rolloutSeconds=77
load.quietSeconds=60
load.seedBookings=1000
# At most this many requests in flight; a request that finds no room is counted as failed.
load.maxInFlight=256
# The timing run: one shard at the size Module 35 estimated (500,000 bookings a day for a year over
# 64 shards = 2,851,563 rows), a probe writing new bookings during every step, and the backfill
# with the batch and pause of Section 8's Command 8.
scale.bookings=2851563
scale.probeWritesPerSecond=150
scale.baselineSeconds=20
backfill.batchRows=10000
backfill.pauseSeconds=0.06

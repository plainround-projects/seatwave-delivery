# Every version is exact. Each was checked on Maven Central on 12 November 2026.
[versions]
result4j = "1.2.0"
jackson = "3.3.0"
postgresql = "42.7.14"
flyway = "13.12.2"
hikari = "7.1.0"
logback = "1.6.6"
junit = "6.1.3"
assertj = "3.27.7"
spotless = "8.11.0"
googleJavaFormat = "2.0.0"
jacoco = "0.8.16"

[libraries]
result4j = { module = "com.github.sviperll:result4j", version.ref = "result4j" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
